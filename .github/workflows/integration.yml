name: Integrated project checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install service and test dependencies
        run: >-
          python -m pip install pytest -r services/telemetry-intelligence/requirements.txt
          -r services/anomaly-engine/requirements.txt -r services/root-cause-analysis/requirements.txt
          -r services/shared-nexus-api/requirements.txt -r services/finops-engine/requirements.txt
          -r services/incident-memory/requirements.txt
      - name: Contracts, telemetry, anomaly engine, registry, deployment wiring and workload
        run: python -m pytest tests/contract tests/m1 tests/m2 tests/test_k8s_traffic.py tests/test_service_registry.py tests/test_deployment_wiring.py -q
      - name: RCA
        run: python -m pytest tests -q
        working-directory: services/root-cause-analysis
      - name: Orchestration, audit regressions and durable local restart behavior
        run: python -m pytest tests -q
        working-directory: services/shared-nexus-api
      - name: Concurrency-sensitive M4 tests are stable (repeated)
        run: for run in 1 2 3; do python -m pytest tests/test_concurrency_and_reconciliation.py tests/test_audit_reproductions.py -q || exit 1; done
        working-directory: services/shared-nexus-api
      - name: FinOps
        run: python -m pytest tests -q
        working-directory: services/finops-engine
      - name: Memory and gateway
        run: python -m unittest discover -s tests -q
        working-directory: services/incident-memory
        env:
          LOG_LEVEL: ERROR
      - name: UI behavior
        run: node --test ui/copilot/storage.test.mjs ui/incident/view.test.mjs
      - name: Grounded-answer evaluation
        run: python services/incident-memory/scripts/evaluate.py
      - name: Compose configuration resolves with every required secret
        run: docker compose -f observability/docker-compose.yml --profile integration config --quiet
        env:
          NEXUS_DB_PASSWORD: ci-only-placeholder
          NEXUS_APPROVAL_TOKEN: ci-only-approval
          NEXUS_INGEST_TOKEN: ci-only-ingest
          M5_OPERATOR_ID: ci-operator
          M5_UI_OPERATOR_TOKEN: ci-only-ui
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" } }
          }
          if ($failed) { exit 1 }

  http-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexus -d nexus_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: >-
          python -m pip install pytest -r services/telemetry-intelligence/requirements.txt
          -r services/anomaly-engine/requirements.txt -r services/root-cause-analysis/requirements.txt
          -r services/shared-nexus-api/requirements.txt -r services/finops-engine/requirements.txt
          -r services/incident-memory/requirements.txt
      - name: M4 PostgreSQL restart, lifecycle, outbox, writer fencing and revisions
        run: python -m pytest tests/test_workflow_postgres.py tests/test_postgres_lease.py -q
        working-directory: services/shared-nexus-api
        env:
          M4_TEST_DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test
      - name: M5 PostgreSQL API restart and citations
        run: python -m unittest discover -s tests -p test_postgres.py -q
        working-directory: services/incident-memory
        env:
          M5_TEST_DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test
          LOG_LEVEL: ERROR
      - name: M6 PostgreSQL persistence
        run: python -m pytest tests/test_db.py -q
        working-directory: services/finops-engine
        env:
          DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test
      - name: Controlled HTTP integration
        run: python -m pytest tests/integration -q
        env:
          M4_TEST_DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test
          M5_TEST_DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test
          NEXUS_INTEGRATION_DATABASE_URL: postgresql://nexus:ci-only-password@127.0.0.1:5432/nexus_test

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [telemetry-intelligence, anomaly-engine, root-cause-analysis, shared-nexus-api, incident-memory, finops-engine, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --provenance=false --platform linux/amd64 -f ${{ matrix.service == 'postgres' && 'observability/postgres/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }} -t nexus/${{ matrix.service }}:ci .
